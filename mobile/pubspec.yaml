name: safecampus_ai
description: "Multi-Objective AI-Based Personalized Safe Route Recommendation for Smart Campus Navigation"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client for FastAPI backend
  dio: ^5.7.0
  http: ^1.2.1

  # Maps (OpenStreetMap — zero cost)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local storage
  shared_preferences: ^2.3.0

  # UI & utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
